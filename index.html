<body>
  <header class="masthead">

  <main class="workspace">
    <aside class="rail">
      <p class="eyebrow">从手边开始</p>
      <h1>一只易拉罐，<br>通往整个世界。</h1>
      <p class="intro">把习以为常的东西拆开，<br>再一路问：它凭什么成立？</p>

          <ellipse cx="114" cy="29" rx="30" ry="7" fill="none" stroke="#9ca693"/>
          <path d="M103 23 Q118 20 123 28 Q119 36 109 33 Q101 31 103 23Z" fill="none" stroke="#6f7b69" stroke-width="1.5"/>

        </svg>
      </div>
      <div class="rail-section"><p class="eyebrow">挑一条好奇心</p><nav id="routes" aria-label="探索路径"></nav></div>
      <div class="rail-section"><p class="eyebrow">这棵树的规矩</p><p class="small">箭头朝向所需技术或更深解释。<br>实线：制造依赖 · 虚线：原理解释<br>它是知识网，也会继续长。</p><div class="tree-count" id="tree-count"></div></div>
    </aside>
    <section class="exploration" aria-label="知识图与节点内容">
      <div class="explore-bar">
        <div class="view-switch" role="group" aria-label="图的范围"><button type="button" id="focus-view" aria-pressed="true">沿着问题走</button><button type="button" id="atlas-view" aria-pressed="false">看整棵树</button></div>
        <div class="search-wrap"><label class="sr-only" for="search">找一个节点</label><input id="search" type="search" placeholder="找节点：电解 / 位错 / 熵…" autocomplete="off"><div id="search-results" hidden></div></div>
      </div>
      <div class="content-split">
        <div class="map-panel">
          <div class="map-title"><div><p class="eyebrow" id="map-kicker">一层一层，往下追</p><h2 id="map-title">易拉罐的来路</h2></div><button type="button" class="quiet-button" id="back" disabled>← 上一步</button></div>

          <div class="trail-panel"><p class="eyebrow">刚才走过的路</p><div id="trail"></div></div>
          <div class="question-seed"><span class="seed-symbol" aria-hidden="true">✳</span><div><p>还有什么，值得继续往下挖？</p><p class="small" id="frontier-text">比如：赤泥怎样处理？涂层如何固化？拉环为什么能沿刻痕打开？</p><button type="button" class="text-link" id="copy-question">复制这个节点的追问 ↗</button></div></div>
        </div>
        <article id="detail" class="detail-panel" aria-label="选中节点的原理与计算" aria-live="polite"></article>
      </div>
    </section>
  </main>
  <footer>从一个物件开始，逐渐接近原理。 <span>计算中的自设参数均标为教学估算；来源可在每个节点展开。</span></footer>
